name: Build FPK & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# 推送 v* tag 后先创建草稿 Release，再调用可复用 workflow 构建并上传 FPK，最后发布 Release。
jobs:
  prepare-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - id: create_release
        name: Create or reset draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          PRERELEASE=false
          case "$TAG" in
            *-rc*|*-beta*|*-alpha*) PRERELEASE=true ;;
          esac

          get_release_id() {
            gh api "repos/${REPOSITORY}/releases/tags/${TAG}" 2>/dev/null \
              | jq -r '.id // empty' \
              || true
          }

          ensure_draft_release() {
            RELEASE_ID="$(get_release_id)"
            if [ -n "$RELEASE_ID" ]; then
              gh api --method PATCH "repos/${REPOSITORY}/releases/${RELEASE_ID}" \
                -f name="Release ${TAG}" \
                -f body="正在构建 fnOS 应用安装包，请稍候。" \
                -F draft=true \
                -F prerelease="$PRERELEASE" >/dev/null
            else
              RELEASE_ID="$(gh api --method POST "repos/${REPOSITORY}/releases" \
                -f tag_name="$TAG" \
                -f name="Release ${TAG}" \
                -f body="正在构建 fnOS 应用安装包，请稍候。" \
                -F draft=true \
                -F prerelease="$PRERELEASE" \
                --jq '.id' 2>/dev/null)" || return 1
            fi
            [ -n "$RELEASE_ID" ]
          }

          for ATTEMPT in 1 2 3 4 5; do
            if ensure_draft_release && [ -n "$RELEASE_ID" ]; then
              echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$ATTEMPT" -eq 5 ]; then
              echo "ERROR: unable to create or update the draft release after ${ATTEMPT} attempts" >&2
              exit 1
            fi
            DELAY=$((ATTEMPT * 15))
            echo "Release API failed; retrying in ${DELAY}s (attempt ${ATTEMPT}/5)" >&2
            sleep "$DELAY"
          done

  build-common:
    name: Build common fnOS FPKs
    needs: prepare-release
    uses: ./.github/workflows/build-common-fn.yml
    with:
      release_tag: ${{ github.ref_name }}
      release_id: ${{ needs.prepare-release.outputs.release_id }}
    secrets: inherit

  build-dsh:
    name: Build DeepSeek Harness FPK
    needs: prepare-release
    uses: ./.github/workflows/build-dsh-fn.yml
    with:
      release_tag: ${{ github.ref_name }}
      release_id: ${{ needs.prepare-release.outputs.release_id }}
    secrets: inherit

  publish-release:
    name: Publish release
    needs: [prepare-release, build-common, build-dsh]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark FPK upload complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          set -euo pipefail

          PRERELEASE=false
          case "$TAG" in
            *-rc*|*-beta*|*-alpha*) PRERELEASE=true ;;
          esac

          RELEASE_BODY=$(cat <<EOF
          ## 📦 fnOS Apps ${TAG}

          FPK 安装包已全部上传，正在生成 Release 说明，请稍候。
          EOF
          )

          gh api --method PATCH "repos/${REPOSITORY}/releases/${RELEASE_ID}" \
            -f name="Release ${TAG}" \
            -f body="$RELEASE_BODY" \
            -F draft=true \
            -F prerelease="$PRERELEASE" >/dev/null

      - name: Setup Node.js 24 for release tasks
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Install release task dependencies
        run: pnpm install --filter @tnnevol/fn-os-apps-cli --frozen-lockfile

      - name: Generate and publish release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run release:notes

  report-failure:
    name: Report failed release
    if: ${{ always() && (needs.prepare-release.result != 'success' || needs.build-common.result != 'success' || needs.build-dsh.result != 'success' || needs.publish-release.result != 'success') }}
    needs: [prepare-release, build-common, build-dsh, publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Update draft release with failure status
        if: ${{ needs.prepare-release.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREPARE_RESULT: ${{ needs.prepare-release.result }}
          COMMON_RESULT: ${{ needs.build-common.result }}
          DSH_RESULT: ${{ needs.build-dsh.result }}
          PUBLISH_RESULT: ${{ needs.publish-release.result }}
        run: |
          set -euo pipefail

          RELEASE_BODY=$(cat <<EOF
          ## ❌ fnOS Apps ${TAG} 构建未完成

          FPK 构建或 Release 发布流程失败，当前 Release 保持草稿状态。请查看 [GitHub Actions 运行日志](${RUN_URL}) 后重试。

          | 阶段 | 状态 |
          |------|------|
          | 创建草稿 Release | ${PREPARE_RESULT} |
          | 构建公共应用 | ${COMMON_RESULT} |
          | 构建 DeepSeek Harness | ${DSH_RESULT} |
          | 发布 Release | ${PUBLISH_RESULT} |
          EOF
          )

          gh api --method PATCH "repos/${REPOSITORY}/releases/${RELEASE_ID}" \
            -f name="Release ${TAG}（构建失败）" \
            -f body="$RELEASE_BODY" \
            -F draft=true >/dev/null

      - name: Log failure when draft release was not created
        if: ${{ needs.prepare-release.result != 'success' }}
        run: |
          echo "The draft release could not be created; no Release body can be updated."
