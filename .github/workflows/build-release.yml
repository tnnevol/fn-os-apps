name: Build FPK & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# 推送 v* tag 后先创建草稿 Release，再调用可复用 workflow 构建并上传 FPK，最后发布 Release。
jobs:
  prepare-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - id: create_release
        name: Create or reset draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          PRERELEASE=false
          case "$TAG" in
            *-rc*|*-beta*|*-alpha*) PRERELEASE=true ;;
          esac

          get_release_id() {
            gh api "repos/${REPOSITORY}/releases/tags/${TAG}" 2>/dev/null \
              | jq -r '.id // empty' \
              || true
          }

          ensure_draft_release() {
            RELEASE_ID="$(get_release_id)"
            if [ -n "$RELEASE_ID" ]; then
              gh api --method PATCH "repos/${REPOSITORY}/releases/${RELEASE_ID}" \
                -f name="Release ${TAG}" \
                -f body="正在构建 fnOS 应用安装包，请稍候。" \
                -F draft=true \
                -F prerelease="$PRERELEASE" >/dev/null
            else
              RELEASE_ID="$(gh api --method POST "repos/${REPOSITORY}/releases" \
                -f tag_name="$TAG" \
                -f name="Release ${TAG}" \
                -f body="正在构建 fnOS 应用安装包，请稍候。" \
                -F draft=true \
                -F prerelease="$PRERELEASE" \
                --jq '.id' 2>/dev/null)" || return 1
            fi
            [ -n "$RELEASE_ID" ]
          }

          for ATTEMPT in 1 2 3 4 5; do
            if ensure_draft_release && [ -n "$RELEASE_ID" ]; then
              echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$ATTEMPT" -eq 5 ]; then
              echo "ERROR: unable to create or update the draft release after ${ATTEMPT} attempts" >&2
              exit 1
            fi
            DELAY=$((ATTEMPT * 15))
            echo "Release API failed; retrying in ${DELAY}s (attempt ${ATTEMPT}/5)" >&2
            sleep "$DELAY"
          done

  build-common:
    name: Build common fnOS FPKs
    needs: prepare-release
    uses: ./.github/workflows/build-common-fn.yml
    with:
      release_tag: ${{ github.ref_name }}
      release_id: ${{ needs.prepare-release.outputs.release_id }}
    secrets: inherit

  build-dsh:
    name: Build DeepSeek Harness FPK
    needs: prepare-release
    uses: ./.github/workflows/build-dsh-fn.yml
    with:
      release_tag: ${{ github.ref_name }}
      release_id: ${{ needs.prepare-release.outputs.release_id }}
    secrets: inherit

  publish-release:
    name: Publish release
    needs: [prepare-release, build-common, build-dsh]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark FPK upload complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          set -euo pipefail

          PRERELEASE=false
          case "$TAG" in
            *-rc*|*-beta*|*-alpha*) PRERELEASE=true ;;
          esac

          RELEASE_BODY=$(cat <<EOF
          ## 📦 fnOS Apps ${TAG}

          FPK 安装包已全部上传，正在生成 Release 说明，请稍候。
          EOF
          )

          gh api --method PATCH "repos/${REPOSITORY}/releases/${RELEASE_ID}" \
            -f name="Release ${TAG}" \
            -f body="$RELEASE_BODY" \
            -F draft=true \
            -F prerelease="$PRERELEASE" >/dev/null

      - name: Generate release notes from uploaded FPKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          RELEASE_ASSETS=""
          for ATTEMPT in 1 2 3 4 5; do
            RELEASE_ASSETS="$(
              gh api "repos/${REPOSITORY}/releases/${RELEASE_ID}" 2>/dev/null \
                | jq -r '.assets[]?.name' \
                || true
            )"
            if [ -n "$RELEASE_ASSETS" ]; then
              break
            fi
            DELAY=$((ATTEMPT * 15))
            echo "Release assets are not visible yet; retrying in ${DELAY}s (attempt ${ATTEMPT}/5)" >&2
            sleep "$DELAY"
          done
          if [ -z "$RELEASE_ASSETS" ]; then
            echo "ERROR: no FPK assets found in release ${RELEASE_ID}" >&2
            exit 1
          fi
          PREV_TAG="$(git tag --sort=-version:refname | awk -v tag="$TAG" 'found { print; exit } $0 == tag { found = 1 }')"

          printf '# 📦 fnOS Apps v%s\n\n| 应用 | 安装包 |\n|------|----------|\n' "$VERSION" > RELEASE_NOTES.md

          for APP_DIR in apps/*/; do
            APP="${APP_DIR%/}"
            APP="${APP#apps/}"
            [ -f "${APP_DIR}manifest" ] || continue

            FPK_NAME=""
            while IFS= read -r ASSET; do
              case "$ASSET" in
                "${APP}-${TAG}"*.fpk)
                  FPK_NAME="$ASSET"
                  break
                  ;;
              esac
            done <<< "$RELEASE_ASSETS"

            if [ -z "$FPK_NAME" ]; then
              echo "ERROR: no FPK asset found for ${APP}" >&2
              exit 1
            fi

            DISPLAY_NAME="$(sed -n 's/^display_name[[:space:]]*=[[:space:]]*//p' "${APP_DIR}manifest" | head -n 1)"
            DISPLAY_NAME="${DISPLAY_NAME:-$APP}"
            printf '| **%s** (`%s`) | %s |\n' "$DISPLAY_NAME" "$APP" "$FPK_NAME" >> RELEASE_NOTES.md
          done

          printf '\n## 🛠 安装方式\n\n1. 下载上方对应的 `.fpk` 安装包\n2. 打开飞牛 fnOS 应用中心\n3. 点击左下角 **手动安装** 按钮\n4. 选择下载好的 `.fpk` 文件完成安装\n' >> RELEASE_NOTES.md

          printf '\n## 📝 提交记录\n\n' >> RELEASE_NOTES.md
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"- %s [%h](https://github.com/${REPOSITORY}/commit/%H)" "${PREV_TAG}..${TAG}" >> RELEASE_NOTES.md
          else
            git log --pretty=format:"- %s [%h](https://github.com/${REPOSITORY}/commit/%H)" --max-count=20 >> RELEASE_NOTES.md
          fi
          printf '\n' >> RELEASE_NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          set -euo pipefail

          PRERELEASE=false
          case "$TAG" in
            *-rc*|*-beta*|*-alpha*) PRERELEASE=true ;;
          esac

          publish_release() {
            local release_body
            release_body="$(<RELEASE_NOTES.md)"
            gh api --method PATCH "repos/${REPOSITORY}/releases/${RELEASE_ID}" \
              -f name="Release ${TAG}" \
              -f body="$release_body" \
              -F draft=false \
              -F prerelease="$PRERELEASE"
          }

          for ATTEMPT in 1 2 3 4 5; do
            if publish_release; then
              exit 0
            fi
            if [ "$ATTEMPT" -eq 5 ]; then
              echo "ERROR: unable to publish the release after ${ATTEMPT} attempts" >&2
              exit 1
            fi
            DELAY=$((ATTEMPT * 15))
            echo "Release API failed; retrying in ${DELAY}s (attempt ${ATTEMPT}/5)" >&2
            sleep "$DELAY"
          done

  report-failure:
    name: Report failed release
    if: ${{ always() && (needs.prepare-release.result != 'success' || needs.build-common.result != 'success' || needs.build-dsh.result != 'success' || needs.publish-release.result != 'success') }}
    needs: [prepare-release, build-common, build-dsh, publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Update draft release with failure status
        if: ${{ needs.prepare-release.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREPARE_RESULT: ${{ needs.prepare-release.result }}
          COMMON_RESULT: ${{ needs.build-common.result }}
          DSH_RESULT: ${{ needs.build-dsh.result }}
          PUBLISH_RESULT: ${{ needs.publish-release.result }}
        run: |
          set -euo pipefail

          RELEASE_BODY=$(cat <<EOF
          ## ❌ fnOS Apps ${TAG} 构建未完成

          FPK 构建或 Release 发布流程失败，当前 Release 保持草稿状态。请查看 [GitHub Actions 运行日志](${RUN_URL}) 后重试。

          | 阶段 | 状态 |
          |------|------|
          | 创建草稿 Release | ${PREPARE_RESULT} |
          | 构建公共应用 | ${COMMON_RESULT} |
          | 构建 DeepSeek Harness | ${DSH_RESULT} |
          | 发布 Release | ${PUBLISH_RESULT} |
          EOF
          )

          gh api --method PATCH "repos/${REPOSITORY}/releases/${RELEASE_ID}" \
            -f name="Release ${TAG}（构建失败）" \
            -f body="$RELEASE_BODY" \
            -F draft=true >/dev/null

      - name: Log failure when draft release was not created
        if: ${{ needs.prepare-release.result != 'success' }}
        run: |
          echo "The draft release could not be created; no Release body can be updated."
