name: Build common fnOS FPKs

# 仅允许被 build-release.yml 调用，不配置 push 或 workflow_dispatch 触发器。
on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to which the FPKs are uploaded
        required: true
        type: string
      release_id:
        description: Release database ID used for asset uploads
        required: true
        type: string

permissions:
  contents: write

jobs:
  discover:
    name: Discover common apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - id: set-matrix
        name: Build app matrix
        run: |
          set -euo pipefail

          APPS_JSON=""
          for DIR in apps/*/; do
            APP="${DIR%/}"
            APP="${APP#apps/}"
            if [ ! -f "apps/${APP}/manifest" ]; then
              echo "Skipping ${APP} (no manifest)"
              continue
            fi
            if [ "$APP" = "fn-deepseek-harness" ]; then
              echo "Skipping ${APP} (built by build-dsh-fn.yml)"
              continue
            fi
            APPS_JSON="${APPS_JSON}${APPS_JSON:+,}\"${APP}\""
          done

          if [ -z "$APPS_JSON" ]; then
            echo "ERROR: no common fnOS apps found" >&2
            exit 1
          fi

          echo "matrix=[${APPS_JSON}]" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.app }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.matrix) }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_ID: ${{ inputs.release_id }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Setup Node.js 24 for repository tasks
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Install repository task dependencies
        run: pnpm install --filter @tnnevol/fn-os-apps-cli --frozen-lockfile

      - name: Install fnpack
        run: |
          curl -fsSL https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64 -o fnpack
          chmod +x fnpack
          sudo mv fnpack /usr/local/bin/fnpack
          fnpack --help

      - name: Build FPK
        run: pnpm exec fn-apps-cli build --fpk --app "${{ matrix.app }}"

      - name: Rename FPK with version
        id: rename
        working-directory: apps/${{ matrix.app }}
        run: |
          set -euo pipefail

          ORIGINAL_FPK="$(find . -maxdepth 1 -type f -name '*.fpk' -print -quit)"
          ORIGINAL_FPK="${ORIGINAL_FPK#./}"
          if [ -z "$ORIGINAL_FPK" ]; then
            echo "ERROR: no .fpk file generated" >&2
            exit 1
          fi

          VERSIONED_FPK="${{ matrix.app }}-${RELEASE_TAG}.fpk"
          mv "$ORIGINAL_FPK" "$VERSIONED_FPK"
          echo "fpk=${VERSIONED_FPK}" >> "$GITHUB_OUTPUT"

      - name: Upload FPK to release
        working-directory: apps/${{ matrix.app }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET_PATH="${{ steps.rename.outputs.fpk }}"
          ASSET_NAME="$(basename "$ASSET_PATH")"

          upload_asset() {
            local existing_asset_id
            existing_asset_id="$(
              gh api "repos/${REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate 2>/dev/null \
                | jq -r --arg name "$ASSET_NAME" '.[] | select(.name == $name) | .id' \
                | head -n 1 \
                || true
            )"
            if [ -n "$existing_asset_id" ]; then
              gh api --method DELETE "repos/${REPOSITORY}/releases/assets/${existing_asset_id}" >/dev/null
            fi
            gh api --method POST \
              "https://uploads.github.com/repos/${REPOSITORY}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}" \
              -H "Content-Type: application/octet-stream" \
              --input "$ASSET_PATH" >/dev/null
            echo "Uploaded ${ASSET_NAME} to Release ${RELEASE_TAG}."
          }

          for ATTEMPT in 1 2 3 4 5; do
            if upload_asset; then
              exit 0
            fi
            if [ "$ATTEMPT" -eq 5 ]; then
              echo "ERROR: unable to upload FPK after ${ATTEMPT} attempts" >&2
              exit 1
            fi
            DELAY=$((ATTEMPT * 15))
            echo "Release upload failed; retrying in ${DELAY}s (attempt ${ATTEMPT}/5)" >&2
            sleep "$DELAY"
          done
