name: SDD Checks

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'docs/**'
      - 'tooling/fn-os-apps-cli/**'
      - 'package.json'
      - 'commitlint.config.mjs'
      - '.lintstagedrc.json'
      - 'lefthook.yml'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
      - 'plugins/**'
      - 'apps/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/sdd-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate SDD and project checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install D2
        env:
          D2_VERSION: 0.7.1
        run: |
          curl -fsSL "https://github.com/terrastruct/d2/releases/download/v${D2_VERSION}/d2-v${D2_VERSION}-linux-amd64.tar.gz" -o /tmp/d2.tar.gz
          tar -xzf /tmp/d2.tar.gz -C /tmp
          sudo install "/tmp/d2-v${D2_VERSION}/bin/d2" /usr/local/bin/d2
          d2 version

      - name: Lint repository
        run: pnpm run lint

      - name: Validate pull request commit messages
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Run repository checks
        run: pnpm run check -- --all
