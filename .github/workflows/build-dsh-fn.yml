name: Build DeepSeek Harness FPK

# 仅允许被 build-release.yml 调用，不配置 push 或 workflow_dispatch 触发器。
on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to which the FPK is uploaded
        required: true
        type: string
      release_id:
        description: Release database ID used for the asset upload
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build fn-deepseek-harness
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_ID: ${{ inputs.release_id }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Setup Node.js 24 for DSH native dependency
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install fnOS DSH plugin build dependencies
        run: pnpm install --frozen-lockfile --filter @tnnevol/dsh-fnos...

      - name: Build bundled fnOS DSH plugin
        run: pnpm --filter @tnnevol/dsh-fnos run build

      - name: Stage bundled fnOS DSH plugin
        run: node apps/fn-deepseek-harness/scripts/prepare-dsh-fnos-plugin.mjs

      - name: Install fnpack
        run: |
          curl -fsSL https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64 -o fnpack
          chmod +x fnpack
          sudo mv fnpack /usr/local/bin/fnpack
          fnpack --help

      - name: Prepare latest DSH native dependency
        id: prepare_dsh
        working-directory: apps/fn-deepseek-harness
        env:
          NPM_REGISTRY: https://registry.npmjs.org/
        run: bash scripts/prepare-dsh-native.sh

      - name: Build FPK
        working-directory: apps/fn-deepseek-harness
        run: fnpack build

      - name: Rename FPK with DSH version
        id: rename
        working-directory: apps/fn-deepseek-harness
        env:
          DSH_VERSION: ${{ steps.prepare_dsh.outputs.dsh_version }}
        run: |
          set -euo pipefail

          if [ -z "$DSH_VERSION" ]; then
            echo "ERROR: DSH version was not resolved" >&2
            exit 1
          fi

          ORIGINAL_FPK="$(find . -maxdepth 1 -type f -name '*.fpk' -print -quit)"
          ORIGINAL_FPK="${ORIGINAL_FPK#./}"
          if [ -z "$ORIGINAL_FPK" ]; then
            echo "ERROR: no .fpk file generated" >&2
            exit 1
          fi

          VERSIONED_FPK="fn-deepseek-harness-${RELEASE_TAG}-dsh-${DSH_VERSION}.fpk"
          mv "$ORIGINAL_FPK" "$VERSIONED_FPK"
          echo "fpk=${VERSIONED_FPK}" >> "$GITHUB_OUTPUT"

      - name: Upload FPK to release
        working-directory: apps/fn-deepseek-harness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET_PATH="${{ steps.rename.outputs.fpk }}"
          ASSET_NAME="$(basename "$ASSET_PATH")"

          upload_asset() {
            local existing_asset_id
            existing_asset_id="$(
              gh api "repos/${REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate 2>/dev/null \
                | jq -r --arg name "$ASSET_NAME" '.[] | select(.name == $name) | .id' \
                | head -n 1 \
                || true
            )"
            if [ -n "$existing_asset_id" ]; then
              gh api --method DELETE "repos/${REPOSITORY}/releases/assets/${existing_asset_id}" >/dev/null
            fi
            gh api --method POST \
              "https://uploads.github.com/repos/${REPOSITORY}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}" \
              -H "Content-Type: application/octet-stream" \
              --input "$ASSET_PATH" >/dev/null
            echo "Uploaded ${ASSET_NAME} to Release ${RELEASE_TAG}."
          }

          for ATTEMPT in 1 2 3 4 5; do
            if upload_asset; then
              exit 0
            fi
            if [ "$ATTEMPT" -eq 5 ]; then
              echo "ERROR: unable to upload FPK after ${ATTEMPT} attempts" >&2
              exit 1
            fi
            DELAY=$((ATTEMPT * 15))
            echo "Release upload failed; retrying in ${DELAY}s (attempt ${ATTEMPT}/5)" >&2
            sleep "$DELAY"
          done
