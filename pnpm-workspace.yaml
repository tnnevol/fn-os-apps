packages:
  - 'apps/*'
  - 'docs'
  - 'tooling/*'

catalog:
  '@braintree/sanitize-url': 7.1.2
  '@antfu/eslint-config': ^9.5.1
  '@commitlint/cli': ^21.2.2
  '@commitlint/config-conventional': ^21.2.2
  '@eslint-react/eslint-plugin': ^5.19.0
  '@miletorix/vitepress-image-viewer': 1.3.2
  '@clack/prompts': 1.7.0
  '@wasm-fmt/shfmt': ^0.2.7
  bumpp: 12.3.0
  changelogithub: 15.0.5
  commander: 14.0.1
  eslint: ^9.39.5
  eslint-plugin-react-refresh: ^0.5.6
  globals: ^17.12.0
  jsonc-eslint-parser: 3.3.0
  lefthook: ^2.1.12
  lint-staged: ^17.5.0
  tsx: ^4.23.13
  turbo: 2.10.12
  '@types/node': ^22.20.0
  cytoscape: 3.34.3
  cytoscape-cose-bilkent: 4.1.0
  debug: 4.4.3
  tsdown: ^0.22.2
  typescript: ^5.9.3
  vitepress: 1.6.4
  mermaid: 11.17.2
  dayjs: 1.11.23
  vitepress-mermaid-plugin: 3.0.0
  vitest: ^4.1.8

# 只有确实需要执行安装脚本的依赖才放行。
# `@parcel/watcher` 由 sass → vite / vitepress 带入，需要构建原生 watcher；
# esbuild 与 lefthook 分别用于打包和 Git 钩子安装。
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lefthook: true
