services:
  discuz:
    container_name: fn-discuz
    image: tencentci/discuz:v3.4
    ports:
      - "${APP_PORT}:80"
      - "${HTTPS_PORT}:443"
    restart: always
    volumes:
    # 数据落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）；容器内路径保持上游原样
      # 上游使用 Docker 托管命名卷 discuz_data；托管卷虽会自动创建，但数据落在 Docker 数据目录，
      # 卸载时不在本应用清理范围内（会残留），故按规约改为绑定挂载到应用数据目录。
      - "${TRIM_PKGVAR}/data:/var/www/html"
