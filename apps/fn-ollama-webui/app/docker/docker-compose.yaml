services:
  open-webui:
    container_name: fn-ollama-webui
    image: ghcr.io/open-webui/open-webui:v0.12.5
    # 运行身份对齐包用户：镜像层默认 root，以 root 写数据会让卸载「删除所有数据」后残留；
    # 容器以包用户运行，运行期写入的文件属主才与卸载回调一致。
    user: "${TRIM_UID}:${TRIM_GID}"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    ports:
      - "${APP_PORT}:8080"
    restart: unless-stopped
    volumes:
      # 对话记录与用户数据，落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data:/app/backend/data"
