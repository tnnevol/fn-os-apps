services:
  qiandao:
    container_name: fn-qiandao
    image: a76yyyy/qiandao:20250803
    # 运行身份对齐包用户：镜像层默认 root，以 root 写数据会让卸载「删除所有数据」后残留；
    # 容器以包用户运行，运行期写入的文件属主才与卸载回调一致。
    user: "${TRIM_UID}:${TRIM_GID}"
    environment:
      - PORT=80
      - AUTO_RELOAD=False
      - AES_KEY=${AES_PWD}
      - COOKIE_SECRET=${COOKIE_PWD}
      - DB_TYPE=sqlite3
      - USER0ISADMIN=False
      - GZIP=True
      - ACCESS_LOG=True
    ports:
      - "${APP_PORT}:80"
    restart: always
    volumes:
      # 任务配置与数据库，落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data:/usr/src/app/config"
