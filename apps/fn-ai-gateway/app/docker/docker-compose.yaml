services:
  ai-gateway:
    container_name: fn-ai-gateway
    image: 1panel/ai-gateway:v1.3.0
    environment:
      - AI_GATEWAY_DATABASE_DRIVER=sqlite
      - AI_GATEWAY_DATABASE_SQLITE_PATH=/opt/ai-gateway/data/db/ai-gateway.db
      - AI_GATEWAY_INITIAL_ADMIN_USERNAME=${AI_GATEWAY_INITIAL_ADMIN_USERNAME}
      - AI_GATEWAY_INITIAL_ADMIN_PASSWORD=${AI_GATEWAY_INITIAL_ADMIN_PASSWORD}
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O - http://127.0.0.1:8080/health/ready >/dev/null || exit 1"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      - "${APP_PORT}:8080"
    restart: always
    volumes:
      # 网关数据（含 SQLite 数据库），落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data:/opt/ai-gateway/data"
      # 已删除上游的 /etc/1panel:/opt/ai-gateway/1panel 宿主挂载：
      # fnOS 上不存在 /etc/1panel，该路径为 1Panel 平台专属（见转换规约「存储与挂载」）。
