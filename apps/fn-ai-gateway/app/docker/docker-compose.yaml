services:
  ai-gateway:
    container_name: fn-ai-gateway
    image: 1panel/ai-gateway:v1.5.1
    # 运行身份对齐包用户：镜像层默认 root，以 root 写入数据目录时文件属主是 root，
    # 卸载回调（以包用户运行）无权删除，选「删除所有数据」后仍留残留。
    # TRIM_UID/TRIM_GID 是 fnOS 注入的应用用户 ID（官方环境变量文档），
    # 容器以包用户身份写数据，卸载即可删干净。
    user: "${TRIM_UID}:${TRIM_GID}"
    # 1.5.1 上游新增的启动契约：显式入口、清空 CMD、给健康检查留 70s 优雅停机
    entrypoint: ["/usr/bin/ai-gateway"]
    command: []
    stop_grace_period: 70s
    environment:
      - AI_GATEWAY_DATABASE_DRIVER=sqlite
      - AI_GATEWAY_DATABASE_SQLITE_PATH=/opt/ai-gateway/data/db/ai-gateway.db
      - AI_GATEWAY_INITIAL_ADMIN_USERNAME=${AI_GATEWAY_INITIAL_ADMIN_USERNAME}
      - AI_GATEWAY_INITIAL_ADMIN_PASSWORD=${AI_GATEWAY_INITIAL_ADMIN_PASSWORD}
      - TZ=${TIME_ZONE}
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O - http://127.0.0.1:8080/health/ready >/dev/null || exit 1"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      - "${APP_PORT}:8080"
    restart: always
    volumes:
      # 网关数据（含 SQLite 数据库），落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data:/opt/ai-gateway/data"
      # 已删除上游的 /etc/1panel:/opt/ai-gateway/1panel 宿主挂载：
      # fnOS 上不存在 /etc/1panel，该路径为 1Panel 平台专属（见转换规约「存储与挂载」）。
      # 1.5.1 上游另加了 /etc/localtime:/etc/localtime:ro，同为宿主绝对路径绑定挂载，
      # 按转换规约一并删除，改用 TZ 环境变量的等价方案，不依赖宿主 /etc 目录。
