services:
  waline:
    container_name: fn-waline
    image: lizheming/waline:1.43.4
    # 运行身份对齐包用户：镜像层默认 root，以 root 写数据会让卸载「删除所有数据」后残留；
    # 容器以包用户运行，运行期写入的文件属主才与卸载回调一致。
    user: "${TRIM_UID}:${TRIM_GID}"
    environment:
      - SQLITE_PATH=/app/data
      - TZ=${TIME_ZONE}
      - JWT_TOKEN=${JWT_TOKEN}
      - COMMENT_AUDIT=${COMMENT_AUDIT}
      - AUTHOR_EMAIL=${AUTHOR_EMAIL}
      - SITE_NAME=${SITE_NAME}
      - SITE_URL=${SITE_URL}
      - SECURE_DOMAINS=${SECURE_DOMAINS}
    ports:
      - "${APP_PORT}:8360"
    restart: always
    volumes:
      # SQLite 数据库，落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data:/app/data"
      # ThinkJS 启动时要把编译后的配置写到 /app/runtime/config/production.json，
      # 而镜像里根本没有 /app/runtime、/app 又归 root(755)，以包用户运行必失败：
      #   Error: ENOENT: no such file or directory, open '/app/runtime/config/production.json'
      # （真机：容器 Up 但立即抛错，入口 000）。挂到包用户可写目录即可。
      - "${TRIM_PKGVAR}/data/runtime:/app/runtime"
