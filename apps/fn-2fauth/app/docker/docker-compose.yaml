services:
  2fauth:
    container_name: fn-2fauth
    image: 2fauth/2fauth:9.0.0
    # USER-EXCEPTION: 镜像自带 Config.User=1000:1000，且 entrypoint 权限是
    # `-r-x------ 1000:1000`——只有 uid 1000 能读。覆盖成包用户后直接失败：
    #   /bin/sh: can't open '/usr/local/bin/entrypoint.sh': Permission denied
    # （真机 RestartCount=12、入口 000）。
    # 本应用的 cmd/install_callback 本来就是按「镜像 uid 1000」做 ACL 授权的
    # （见其中的 IMAGE_UID=1000），与覆盖 user: 自相矛盾；正确做法是沿用镜像身份，
    # 由 ACL 把包用户可写的目录授权给 1000。属主不同的遗留数据由卸载回调如实上报。
    environment:
      - APP_NAME=${APP_NAME}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - IS_DEMO_APP=false
      - LOG_CHANNEL=daily
      - LOG_LEVEL=notice
      # 上游原值 /srv/database/database.sqlite 不在挂载目录内，会导致容器重建即丢数据；
      # 改为挂载目录内的路径，由 cmd/install_callback 预创建该子目录
      - DB_DATABASE=/2fauth/database/sqlite.db
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - AUTHENTICATION_GUARD=web-guard
    ports:
      - "${APP_PORT}:8000"
    restart: always
    volumes:
      # SQLite 数据库与配置，落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data:/2fauth"
