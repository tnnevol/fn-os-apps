services:
  2fauth:
    container_name: fn-2fauth
    image: 2fauth/2fauth:9.0.0
    # 运行身份对齐包用户：镜像层默认 root，以 root 写数据会让卸载「删除所有数据」后残留；
    # 容器以包用户运行，运行期写入的文件属主才与卸载回调一致。
    user: "${TRIM_UID}:${TRIM_GID}"
    environment:
      - APP_NAME=${APP_NAME}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - IS_DEMO_APP=false
      - LOG_CHANNEL=daily
      - LOG_LEVEL=notice
      # 上游原值 /srv/database/database.sqlite 不在挂载目录内，会导致容器重建即丢数据；
      # 改为挂载目录内的路径，由 cmd/install_callback 预创建该子目录
      - DB_DATABASE=/2fauth/database/sqlite.db
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - AUTHENTICATION_GUARD=web-guard
    ports:
      - "${APP_PORT}:8000"
    restart: always
    volumes:
      # SQLite 数据库与配置，落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data:/2fauth"
