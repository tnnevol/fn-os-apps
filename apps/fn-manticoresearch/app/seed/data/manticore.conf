searchd {
    listen = 9306:mysql41
    listen = 9312
    # HTTP/JSON 接口：compose 把 APP_PORT 映射到 9308，缺这一行端口不会有监听者，
    # 应用入口一直打不开。Manticore 要求显式声明 HTTP 监听（默认不开启）。
    listen = 9308:http
    log = /var/log/manticore/searchd.log
    query_log = /var/log/manticore/query.log
    pid_file = /var/run/manticore/searchd.pid
    data_dir = /var/lib/manticore
}
