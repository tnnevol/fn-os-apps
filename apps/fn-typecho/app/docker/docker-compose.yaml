services:
  typecho:
    container_name: fn-typecho
    image: joyqi/typecho:1.3.0-php8.2-apache
    environment:
      - TYPECHO_INSTALL=1
      # 上游的 TYPECHO_DB_ADAPTER 由其 init.sh 按数据库类型三分支派生；fnOS 无该钩子，
      # 且 compose 无法条件分支，故固定为 Pdo_Mysql（向导只提供 MySQL/MariaDB）。
      - TYPECHO_DB_ADAPTER=Pdo_Mysql
      - TYPECHO_DB_HOST=${DB_HOST}
      - TYPECHO_DB_PORT=${DB_PORT}
      - TYPECHO_DB_DATABASE=${DB_NAME}
      - TYPECHO_DB_USER=${DB_USERNAME}
      - TYPECHO_DB_PASSWORD=${DB_PASSWORD}
      - TYPECHO_USER_NAME=${TYPECHO_USER_NAME}
      - TYPECHO_USER_PASSWORD=${TYPECHO_USER_PASSWORD}
      - TYPECHO_USER_MAIL=${TYPECHO_USER_MAIL}
      - TYPECHO_SITE_URL=${TYPECHO_EXTERNAL_URL}
    ports:
      - "${APP_PORT}:80"
    command:
      - /bin/bash
      - -c
      - |
        set -e
        # Refresh core files while preserving config.inc.php, usr and .htaccess.
        for file in admin install var index.php install.php; do
          rm -rf "/app/$$file"
          cp -a "/usr/src/typecho/$$file" "/app/$$file"
          chown -R www-data:www-data "/app/$$file"
        done
        exec /bin/init_typecho apache
    restart: always
    volumes:
    # 数据落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）；容器内路径保持上游原样
      - "${TRIM_PKGVAR}/data:/app"
