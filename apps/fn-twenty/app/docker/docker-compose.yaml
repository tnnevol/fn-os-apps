services:
  server:
    container_name: fn-twenty
    image: twentycrm/twenty:v2.45.6
    environment:
      - NODE_PORT=3000
      # 上游把凭据与连接整段拼成一个 URL，故走「合并」风格
      - PG_DATABASE_URL=postgres://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}
      - SERVER_URL=${TWENTY_SERVER_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:6379
      - STORAGE_TYPE=local
      - APP_SECRET=${TWENTY_APP_SECRET}
    ports:
      - "${APP_PORT}:3000"
    restart: always
    volumes:
    # 数据落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）；容器内路径保持上游原样
      - "${TRIM_PKGVAR}/data:/app/packages/twenty-server/.local-storage"

  # 后台任务进程（无端口），依赖 server 健康后启动
  worker:
    container_name: fn-twenty-worker
    image: twentycrm/twenty:v2.45.6
    command: ["yarn", "worker:prod"]
    environment:
      - PG_DATABASE_URL=postgres://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}
      - SERVER_URL=${TWENTY_SERVER_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:6379
      - STORAGE_TYPE=local
      - APP_SECRET=${TWENTY_APP_SECRET}
    depends_on:
      server:
        condition: service_healthy
    restart: always
    volumes:
    # 数据落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）；容器内路径保持上游原样
      - "${TRIM_PKGVAR}/data:/app/packages/twenty-server/.local-storage"
