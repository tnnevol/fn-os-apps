services:
  bytebase:
    container_name: fn-bytebase
    image: bytebase/bytebase:3.24.0
    # 运行身份对齐包用户：镜像层默认 root，以 root 写数据会让卸载「删除所有数据」后残留；
    # 容器以包用户运行，运行期写入的文件属主才与卸载回调一致。
    user: "${TRIM_UID}:${TRIM_GID}"
    init: true
    ports:
      - "${APP_PORT}:8080"
    restart: always
    volumes:
      # 元数据与变更记录，落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data:/var/opt/bytebase"
