services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    # 运行身份对齐包用户：镜像层默认 root，以 root 写数据会让卸载「删除所有数据」后残留；
    # 容器以包用户运行，运行期写入的文件属主才与卸载回调一致。
    user: "${TRIM_UID}:${TRIM_GID}"
    container_name: fn-jellyfin
    restart: always
    ports:
      - "${APP_PORT}:8096"
    volumes:
      # 应用配置落目标 NAS 运行时数据目录
      - "${TRIM_PKGVAR}/data/config:/config"
      # 用户自填的媒体库与缓存目录（绝对路径，由向导收集）
      - "${MEDIA_PATH}:/media/media"
      - "${CACHE_PATH}:/cache"
