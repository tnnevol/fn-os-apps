services:
  zabbix-proxy-mysql:
    container_name: fn-zabbix-proxy
    image: zabbix/zabbix-proxy-mysql:alpine-7.4.5
    environment:
      - TZ=${TIME_ZONE}
      - ZBX_HOSTNAME=${ZABBIX_PROXY_HOSTNAME}
      - ZBX_SERVER_HOST=${ZABBIX_SERVER}
      - ZBX_PROXYMODE=0
      # 上游由 1Panel 服务选择器注入 PANEL_DB_*，fnOS 改为向导显式填写
      - DB_SERVER_HOST=${DB_HOST}
      - DB_SERVER_PORT=${DB_PORT}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    ports:
      - "${APP_PORT}:10051"
    restart: always
