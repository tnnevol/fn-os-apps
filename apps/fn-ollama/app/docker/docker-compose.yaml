services:
  ollama:
    container_name: fn-ollama
    image: ollama/ollama:0.40.13
    # 运行身份对齐包用户：镜像层默认 root，以 root 写数据会让卸载「删除所有数据」后残留；
    # 容器以包用户运行，运行期写入的文件属主才与卸载回调一致。
    user: "${TRIM_UID}:${TRIM_GID}"
    ports:
      - "${APP_PORT}:11434"
    restart: unless-stopped
    tty: true
    volumes:
      # 模型文件与应用状态，落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）；
      # 模型文件较大（单个数 GB），请注意所选存储空间的容量
      - "${TRIM_PKGVAR}/data:/root/.ollama"
