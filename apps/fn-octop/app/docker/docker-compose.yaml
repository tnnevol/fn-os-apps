services:
  octop:
    container_name: fn-octop
    image: ghcr.io/tencentcloud/octop:1.0.1
    environment:
      - HOME=/data
      - OCTOP_BIND_HOST=0.0.0.0
      - OCTOP_PORT=8088
      - OCTOP_LOG_LEVEL=${OCTOP_LOG_LEVEL}
      - OCTOP_DEFAULT_PASSWORD=${OCTOP_DEFAULT_PASSWORD}
      - OCTOP_ADMIN_USERNAME=${OCTOP_ADMIN_USERNAME}
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -f http://localhost:8088/api/health || exit 1"
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    ports:
      - "${APP_PORT}:8088"
    restart: always
    volumes:
      # 平台数据，落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data:/data"
