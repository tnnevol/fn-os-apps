services:
  openclaw:
    container_name: fn-openclaw
    image: 1panel/openclaw:2026.9.8
    init: true
    environment:
      - HOME=/home/node
      - TERM=xterm-256color
      - OPENCLAW_DISABLE_BONJOUR=1
      - PROVIDER=${PROVIDER}
      - MODEL=${MODEL}
      - API_KEY=${API_KEY}
      - BASE_URL=${BASE_URL}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3m
      timeout: 10s
      start_period: 15s
      retries: 3
    ports:
      - "${APP_PORT}:18789"
    restart: unless-stopped
    volumes:
    # 数据落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）；容器内路径保持上游原样
      - "${TRIM_PKGVAR}/data/data/conf:/home/node/.openclaw"
      - "${TRIM_PKGVAR}/data/data/workspace:/home/node/.openclaw/workspace"
      # 已删除上游的 /etc/localtime 宿主路径挂载：
      # 该路径在 fnOS 上不作为应用挂载点使用，时区改由 TZ 环境变量提供（见转换规约「存储与挂载」）
