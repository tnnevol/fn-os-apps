services:
  onlyoffice:
    container_name: fn-onlyoffice
    image: onlyoffice/documentserver:9.4.0.1
    environment:
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "${APP_PORT}:80"
    restart: always
    volumes:
    # 数据落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）；容器内路径保持上游原样
      - "${TRIM_PKGVAR}/data/logs:/var/log/onlyoffice"
      - "${TRIM_PKGVAR}/data/data:/var/www/onlyoffice/Data"
      - "${TRIM_PKGVAR}/data/lib:/var/lib/onlyoffice"
      - "${TRIM_PKGVAR}/data/db:/var/lib/postgresql"
