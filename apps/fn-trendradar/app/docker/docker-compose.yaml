services:
  trend-radar:
    container_name: fn-trendradar
    image: wantcat/trendradar:6.10.0
    environment:
      - CRON_SCHEDULE=${CRON_SCHEDULE}
      - RUN_MODE=${RUN_MODE}
      - IMMEDIATE_RUN=${IMMEDIATE_RUN}
    ports:
      - "${APP_PORT}:8080"
    restart: always
    volumes:
      # 配置文件（只读）与输出结果，落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data/config:/app/config:ro"
      - "${TRIM_PKGVAR}/data/output:/app/output"
