services:
  trend-radar:
    container_name: fn-trendradar
    image: wantcat/trendradar:6.11.0
    # 运行身份对齐包用户：镜像层默认 root，以 root 写数据会让卸载「删除所有数据」后残留；
    # 容器以包用户运行，运行期写入的文件属主才与卸载回调一致。
    user: "${TRIM_UID}:${TRIM_GID}"
    environment:
      - CRON_SCHEDULE=${CRON_SCHEDULE}
      - RUN_MODE=${RUN_MODE}
      - IMMEDIATE_RUN=${IMMEDIATE_RUN}
    ports:
      - "${APP_PORT}:8080"
    restart: always
    volumes:
      # 配置文件（只读）与输出结果，落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data/config:/app/config:ro"
      - "${TRIM_PKGVAR}/data/output:/app/output"
