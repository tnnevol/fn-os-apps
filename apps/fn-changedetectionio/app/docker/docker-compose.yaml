services:
  changedetection:
    container_name: fn-changedetectionio
    image: dgtlmoon/changedetection.io:0.60.10
    # 运行身份对齐包用户：镜像层默认 root，以 root 写数据会让卸载「删除所有数据」后残留；
    # 容器以包用户运行，运行期写入的文件属主才与卸载回调一致。
    user: "${TRIM_UID}:${TRIM_GID}"
    ports:
      - "${APP_PORT}:5000"
    restart: always
    volumes:
      # 监控目标与历史快照，落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data:/datastore"
