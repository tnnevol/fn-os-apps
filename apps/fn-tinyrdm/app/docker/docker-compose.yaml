services:
  dashboard:
    container_name: fn-tinyrdm
    image: ghcr.io/tiny-craft/tiny-rdm:1.2.7
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    ports:
      - "${APP_PORT}:8086"
    restart: always
    # 与 1Panel 上游保持一致：user: "0:0"。
    # 该镜像的 nginx 在启动时要创建并写入 /var/lib/nginx/{logs,tmp}（镜像层，归 root），
    # 以非 root 运行会 Permission denied 并无限重启。已验证三种非 root 方案均不可行：
    #   1) 宿主绑定挂载这些目录——容器由应用中心在 install_callback 之前创建，
    #      Docker 会把尚不存在的挂载源以 root 建出，包用户仍不可写；
    #   2) compose tmpfs——该平台未生效；
    #   3) Docker 命名卷——卷初始属主是 root，同样不可写。
    # 上游本身就是 root 运行，这里回归上游设定，不再自行降权。
    user: "0:0"
    volumes:
      # 连接配置与数据，落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data:/app/tinyrdm"
