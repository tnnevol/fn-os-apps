services:
  llama-cpp:
    container_name: fn-llama-cpp
    image: ghcr.io/ggml-org/llama.cpp:server
    # 运行身份对齐包用户：镜像层默认 root，以 root 写数据会让卸载「删除所有数据」后残留；
    # 容器以包用户运行，运行期写入的文件属主才与卸载回调一致。
    user: "${TRIM_UID}:${TRIM_GID}"
    command: ${START_COMMAND}
    ports:
      - "${APP_PORT}:8080"
    restart: unless-stopped
    volumes:
      # 用户在向导中填写的模型目录，只读挂载，应用不应修改模型文件
      - "${MODEL_PATH}:/models:ro"
