services:
  archivebox:
    container_name: fn-archivebox
    image: archivebox/archivebox:0.9.77
    # USER-EXCEPTION: entrypoint 内置固定 uid=960 gid=955 并在内部 chown，与 TRIM_UID 不一致时无法写 /opt/archivebox 与 /data（真机日志："archivebox user (uid=960 gid=955) cannot write ... Current owner is "），故不覆盖运行身份
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    ports:
      - "${APP_PORT}:5797"
    restart: always
    volumes:
      # 归档内容与索引，落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data:/data"
