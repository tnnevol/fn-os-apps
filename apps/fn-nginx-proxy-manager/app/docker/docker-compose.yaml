services:
  nginxpm:
    container_name: fn-nginx-proxy-manager
    image: jc21/nginx-proxy-manager:2.16.0
    ports:
      - "${HTTP_PORT}:80"
      - "${APP_PORT}:81"
      - "${HTTPS_PORT}:443"
    restart: always
    volumes:
    # 数据落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）；容器内路径保持上游原样
      - "${TRIM_PKGVAR}/data/data:/data"
      - "${TRIM_PKGVAR}/data/ssl:/etc/letsencrypt"
