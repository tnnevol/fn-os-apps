services:
  n8n:
    container_name: fn-n8n
    image: n8nio/n8n:2.42.3
    environment:
      - N8N_SECURE_COOKIE=false
      - TZ=${TIME_ZONE}
    ports:
      - "${APP_PORT}:5678"
    restart: always
    volumes:
      # 工作流与凭据，落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data:/home/node/.n8n"
