services:
  teable:
    container_name: fn-teable
    image: ghcr.io/teableio/teable:latest
    # 按裁决 B：镜像层默认 root（config.User 为 null），加 user: 以包用户运行
    user: "${TRIM_UID}:${TRIM_GID}"
    environment:
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN}
      - TZ=${TIME_ZONE}
      - NEXT_ENV_IMAGES_ALL_REMOTE=true
      # 上游把 5432 写死，按 ghost/metabase 先例解开为向导字段
      - PRISMA_DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - BACKEND_CACHE_PROVIDER=redis
      # 上游把 6379 写死，同样解开为向导字段
      - BACKEND_CACHE_REDIS_URI=redis://default:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/0
    ports:
      - "${APP_PORT}:3000"
    restart: always
    volumes:
    # 数据落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）；容器内路径保持上游原样
      # 上游声明 :rw，按规约保留
      - "${TRIM_PKGVAR}/data:/app/.assets:rw"
