<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memos 升级管理</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1 data-i18n="heading">Memos 管理</h1>
        <div class="lang-switch">
          <select
            id="langSelect"
            class="lang-select"
            data-i18n-title="language"
          ></select>
        </div>
      </div>

      <div class="info-card">
        <div class="info-row">
          <span class="info-label" data-i18n="currentVersion">当前版本</span>
          <span class="info-value current" id="currentVersion">
            <span class="spinner"></span>
            <span data-i18n="detecting">检测中...</span>
          </span>
        </div>
        <div class="info-row">
          <span class="info-label" data-i18n="latestVersion">最新版本</span>
          <span class="info-value latest" id="latestVersion">
            <span class="spinner"></span>
            <span data-i18n="detecting">检测中...</span>
          </span>
        </div>
        <div class="info-row" id="statusRow" style="display: none">
          <span class="info-label" data-i18n="status">状态</span>
          <span id="upgradeStatus"></span>
        </div>
      </div>

      <div class="btn-group">
        <button
          class="btn btn-check"
          id="checkBtn"
          data-i18n="checkUpdate"
          onclick="checkVersion()"
        >
          检查更新
        </button>
        <button
          class="btn btn-primary"
          id="upgradeBtn"
          data-i18n="upgrade"
          onclick="doUpgrade()"
          disabled
        >
          升级 Memos
        </button>
      </div>

      <div class="log-panel" id="logArea" style="display: none"></div>
    </div>

    <script src="i18n.js"></script>
    <script src="index.js"></script>
  </body>
</html>
