services:
  ezbookkeeping:
    container_name: fn-ezbookkeeping
    image: mayswind/ezbookkeeping:2.0.1
    # 运行身份：镜像层已是非 root（config.User = "1000:1000"），按裁决 B 无需再加 user:。
    # 注意：该固定 uid(1000:1000) 与 fnOS 包用户 uid(9xx) 不同，属已登记的待验证项。
    ports:
      - "${APP_PORT}:8080"
    restart: unless-stopped
    volumes:
      # 已删除上游的 /etc/localtime:/etc/localtime:ro：宿主路径挂载按规约不允许
# 共享目录（用户可见）：宿主侧只有 1 个 data-share，其下按用途建子目录
      - "${TRIM_APPDEST_VOL}/@appshare/fn-ezbookkeeping/storage:/ezbookkeeping/storage"
# 应用私有数据：用户不可见，不与共享目录混用
      - "${TRIM_PKGVAR}/data/data:/ezbookkeeping/data"
      - "${TRIM_PKGVAR}/data/log:/ezbookkeeping/log"
