services:
  laya-server:
    container_name: fn-laya-server
    image: 1panel/laya-server:v0.1.2
    environment:
      - LAYA_ADMIN_USERNAME=${LAYA_ADMIN_USERNAME}
      - LAYA_ADMIN_PASSWORD=${LAYA_ADMIN_PASSWORD}
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=3)\" || exit 1"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    ports:
      - "${APP_PORT}:8080"
    restart: always
    volumes:
      # 决策引擎数据，落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data:/data"
