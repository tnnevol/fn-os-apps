services:
  wallos:
    container_name: fn-wallos
    image: bellamy/wallos:5.8.3
    environment:
      - TZ=${TIME_ZONE}
    healthcheck:
      test: ["NONE"]
    ports:
      - "${APP_PORT}:80"
    restart: unless-stopped
    volumes:
    # 数据落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）；容器内路径保持上游原样
      - "${TRIM_PKGVAR}/data/db:/var/www/html/db"
      - "${TRIM_PKGVAR}/data/logos:/var/www/html/images/uploads/logos"
