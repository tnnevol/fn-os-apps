services:
  trilium:
    image: triliumnext/trilium:v0.106.1
    # 运行身份对齐包用户：镜像层默认 root，以 root 写数据会让卸载「删除所有数据」后残留；
    # 容器以包用户运行，运行期写入的文件属主才与卸载回调一致。
    user: "${TRIM_UID}:${TRIM_GID}"
    container_name: fn-trilium
    restart: unless-stopped
    ports:
      - "${APP_PORT}:8080"
    environment:
      - TRILIUM_DATA_DIR=/home/node/trilium-data
      - TZ=${TIME_ZONE}
    volumes:
      # 笔记数据落目标 NAS 运行时数据目录
      - "${TRIM_PKGVAR}/data:/home/node/trilium-data"
