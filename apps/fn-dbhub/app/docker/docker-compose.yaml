services:
  dbhub:
    container_name: fn-dbhub
    image: bytebase/dbhub:1.5.0
    # 运行身份对齐包用户：镜像层默认 root，以 root 写数据会让卸载「删除所有数据」后残留；
    # 容器以包用户运行，运行期写入的文件属主才与卸载回调一致。
    user: "${TRIM_UID}:${TRIM_GID}"
    environment:
      # 上游由 1Panel 服务选择器注入 DBHUB_DB_*，fnOS 改为向导显式填写
      - "DSN=${DB_TYPE}://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}"
    ports:
      - "${APP_PORT}:8080"
    restart: always
