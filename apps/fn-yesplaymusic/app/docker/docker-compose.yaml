services:
  yesplaymusic:
    container_name: fn-yesplaymusic
    image: fogforest/yesplaymusic:0.4.9
    # 运行身份对齐包用户：镜像层默认 root，以 root 写数据会让卸载「删除所有数据」后残留；
    # 容器以包用户运行，运行期写入的文件属主才与卸载回调一致。
    user: "${TRIM_UID}:${TRIM_GID}"
    ports:
      - "${APP_PORT}:80"
    restart: always
    volumes:
      # 加了 user: 之后 nginx 以包用户运行，但它要写镜像层的 /var/cache/nginx（临时目录）
      # 与 /var/run（pid），两者都归 root，于是启动即失败：
      #   nginx: [emerg] mkdir() "/var/cache/nginx/client_temp" failed (13: Permission denied)
      # 结果是容器里只剩 node 的 3000 端口在听，而映射指向 80，入口探活为 000（真机复现）。
      # 把这两个路径挂到包用户可写的数据目录即可。
      - "${TRIM_PKGVAR}/cache:/var/cache/nginx"
      - "${TRIM_PKGVAR}/run:/var/run"
