services:
  calibre-web:
    container_name: fn-calibre-web
    image: linuxserver/calibre-web:0.6.27
    environment:
      # TRIM_UID/TRIM_GID 由 fnOS 注入，指向本应用的包用户；上游硬编码的 1000 在目标 NAS 上通常是登录用户
      - PUID=${TRIM_UID}
      - PGID=${TRIM_GID}
      - TZ=${TIME_ZONE}
      - DOCKER_MODS=linuxserver/mods:universal-calibre
      - OAUTHLIB_RELAX_TOKEN_SCOPE=1
    # 运行身份：该镜像为 linuxserver s6-overlay（Entrypoint 为 /init），
    # s6 强依赖以 root 启动做服务初始化与降权，因此不加 user:（s6 例外）；
    # 其服务身份由上方 PUID/PGID 指定为包用户。
    ports:
      - "${APP_PORT}:8083"
    restart: always
    volumes:
# 共享目录（用户可见）：宿主侧只有 1 个 data-share，其下按用途建子目录
      - "${TRIM_APPDEST_VOL}/@appshare/fn-calibre-web/books:/books"
# 应用私有数据：用户不可见，不与共享目录混用
      - "${TRIM_PKGVAR}/data/config:/config"
