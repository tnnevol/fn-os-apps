services:
  jsonhero:
    container_name: fn-jsonhero
    image: henryclw/jsonhero-web:latest
    # 与 1Panel 上游保持一致：不指定 user，使用镜像自带用户。
    # 该镜像启动时会用 npm 重新构建前端，需要写 /app/build、./app/tailwind.css
    # 与 /.npm（均在镜像层）。自行加 user: 降权会 Permission denied；
    # 上游没有降权，这里同样不覆盖。
    ports:
      - "${APP_PORT}:8787"
    restart: always
