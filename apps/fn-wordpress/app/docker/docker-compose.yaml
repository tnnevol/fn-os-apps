services:
  wordpress:
    container_name: fn-wordpress
    image: wordpress:7.1.3
    environment:
      # 上游由 1Panel 服务选择器注入 PANEL_DB_*，fnOS 改为向导显式填写
      - WORDPRESS_DB_HOST=${DB_HOST}:${DB_PORT}
      - WORDPRESS_DB_NAME=${DB_NAME}
      - WORDPRESS_DB_USER=${DB_USERNAME}
      - WORDPRESS_DB_PASSWORD=${DB_PASSWORD}
      - WORDPRESS_DEBUG=0
    ports:
      - "${APP_PORT}:80"
    restart: always
    volumes:
    # 数据落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）；容器内路径保持上游原样
      - "${TRIM_PKGVAR}/data:/var/www/html"
      # 单文件挂载：文件由 cmd/install_callback 预创建并写入最小可用配置
      - "${TRIM_PKGVAR}/data/conf/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini"
