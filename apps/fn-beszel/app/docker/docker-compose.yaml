services:
  beszel:
    container_name: fn-beszel
    image: henrygd/beszel:0.21.0
    ports:
      - "${APP_PORT}:8090"
    restart: unless-stopped
    volumes:
    # 数据落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）；容器内路径保持上游原样
      - "${TRIM_PKGVAR}/data/data:/beszel_data"
      - "${TRIM_PKGVAR}/data/socket:/beszel_socket"
