services:
  koodo-reader:
    container_name: fn-koodo-reader
    image: ghcr.io/koodo-reader/koodo-reader:master
    # 按裁决 B：镜像层默认 root（config.User 为 null），加 user: 以包用户运行
    user: "${TRIM_UID}:${TRIM_GID}"
    environment:
      - SERVER_USERNAME=${SERVER_USERNAME}
      - SERVER_PASSWORD=${SERVER_PASSWORD}
      - ENABLE_HTTP_SERVER=true
    ports:
      - "${APP_PORT}:80"
    restart: always
    volumes:
    # 数据落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）；容器内路径保持上游原样
      - "${TRIM_PKGVAR}/data:/app/uploads"
