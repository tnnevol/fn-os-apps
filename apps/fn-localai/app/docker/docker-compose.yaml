services:
  localai:
    container_name: fn-localai
    image: localai/localai:v3.12.1-aio-cpu
    environment:
      - DEBUG=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 1m
      timeout: 20m
      retries: 5
    ports:
      - "${APP_PORT}:8080"
    restart: always
    volumes:
      # 模型与配置，落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data:/build/models:cached"
