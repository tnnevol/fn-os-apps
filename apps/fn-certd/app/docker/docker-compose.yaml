services:
  certd:
    container_name: fn-certd
    image: greper/certd:1.46.0
    # 运行身份对齐包用户：镜像层默认 root，以 root 写数据会让卸载「删除所有数据」后残留；
    # 容器以包用户运行，运行期写入的文件属主才与卸载回调一致。
    user: "${TRIM_UID}:${TRIM_GID}"
    ports:
      - "${APP_PORT}:7001"
      - "${HTTPS_PORT}:7002"
    restart: always
    volumes:
    # 数据落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）；容器内路径保持上游原样
      - "${TRIM_PKGVAR}/data/certd:/app/data"
      # log4js 启动时要写工作目录下的 logs/app.log，镜像层不可写；
      # 不挂出来会 EACCES: permission denied, open 'logs/app.log' 并重启循环（真机复现）。
      - "${TRIM_PKGVAR}/logs:/app/logs"
