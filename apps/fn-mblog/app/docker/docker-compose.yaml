services:
  mblog:
    container_name: fn-mblog
    image: kingwrcy/mblog:1.1.0
    # 运行身份对齐包用户：镜像层默认 root，以 root 运行会让运行期写入的文件属 root，
    # 卸载回调（包用户）删不掉，选「删除所有数据」后仍留残留。
    user: "${TRIM_UID}:${TRIM_GID}"

    environment:
      - DB_TYPE=-sqlite
    ports:
      - "${APP_PORT}:38321"
    restart: always
    volumes:
      # 博客内容与数据库，落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data:/opt/mblog"
