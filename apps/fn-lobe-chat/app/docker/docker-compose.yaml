services:
  lobe-chat:
    container_name: fn-lobe-chat
    image: lobehub/lobe-chat:1.143.3
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_PROXY_URL=${OPENAI_PROXY_URL}
      - ACCESS_CODE=${ACCESS_CODE}
      - OPENAI_MODEL_LIST=${OPENAI_MODEL_LIST}
    ports:
      - "${APP_PORT}:3210"
    restart: always
