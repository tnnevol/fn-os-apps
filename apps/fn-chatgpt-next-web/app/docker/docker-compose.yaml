services:
  chatgpt-next-web:
    container_name: fn-chatgpt-next-web
    image: yidadaa/chatgpt-next-web:v2.16.1
    # 运行身份对齐包用户：镜像层默认 root，以 root 写数据会让卸载「删除所有数据」后残留；
    # 容器以包用户运行，运行期写入的文件属主才与卸载回调一致。
    user: "${TRIM_UID}:${TRIM_GID}"
    environment:
      - OPENAI_API_KEY=${API_KEY}
      - CODE=${SECRET_KEY}
      - PROXY_URL=${PROXY}
      - BASE_URL=${API_BASE_URL}
      - WHITE_WEBDAV_ENDPOINTS=${WHITE_WEBDAV_ENDPOINTS}
    ports:
      - "${APP_PORT}:3000"
    restart: always
