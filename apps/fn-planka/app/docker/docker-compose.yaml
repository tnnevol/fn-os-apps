services:
  planka:
    container_name: fn-planka
    image: ghcr.io/plankanban/planka:2.2.1
    environment:
      - BASE_URL=${PLANKA_EXTERNAL_URL}
      # 上游把连接信息整段拼成 DATABASE_URL，故走「合并」风格
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}
      - SECRET_KEY=${PLANKA_SECRET_KEY}
      - DEFAULT_ADMIN_NAME=${DEFAULT_ADMIN_NAME}
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL}
    ports:
      - "${APP_PORT}:1337"
    restart: always
    volumes:
    # 数据落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）；容器内路径保持上游原样
      - "${TRIM_PKGVAR}/data:/app/data"
