services:
  huginn:
    container_name: fn-huginn
    image: ghcr.io/huginn/huginn:latest
    # USER-EXCEPTION: 镜像把整个 Rails 运行目录都建成 default(uid=1001):root 所有——
    # 除 /app 是 775 外，/app/tmp、/app/db、/app/log、/app/vendor 及其 bundle 全是 755。
    # 启动链要写这些路径（setup_env 的 `cp /tmp/.env /app/.env`、Bundler 的
    # `rb_sysopen - /app/vendor/bundle/ruby/4.0.0/bin/dotenv.lock`、puma 的 tmp/pid），
    # 以包用户运行必然 Permission denied 并无限重启（真机 RestartCount=9）。
    # 逐个改挂载既覆盖不全、又会随镜像内部路径变动失效，故沿用镜像自带身份。
    # 数据目录由 cmd/install_callback 建好后 chown 到镜像用户，保证可写且能随卸载清理。
    ports:
      - "${APP_PORT}:3000"
    restart: always
    volumes:
      # 容器内自带的 MySQL 数据目录（本应用不使用外部数据库）
      - "${TRIM_PKGVAR}/data:/var/lib/mysql"
