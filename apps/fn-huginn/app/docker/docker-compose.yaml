services:
  huginn:
    container_name: fn-huginn
    image: ghcr.io/huginn/huginn:latest
    # 镜像内置用户是 uid=1001，而挂载的 /var/lib/mysql 属主是 fnOS 包用户，
    # 身份不一致导致 bootstrap 失败（mv: cannot create ...: Permission denied）。
    # 显式以包用户运行，与数据目录属主对齐。
    user: "${TRIM_UID}:${TRIM_GID}"
    ports:
      - "${APP_PORT}:3000"
    restart: always
    volumes:
    # 数据落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）；容器内路径保持上游原样
      # 容器内自带的 MySQL 数据目录（本应用不使用外部数据库）
      - "${TRIM_PKGVAR}/data:/var/lib/mysql"
