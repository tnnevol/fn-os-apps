services:
  gotify:
    container_name: fn-gotify
    image: gotify/server:3.1.1
    environment:
      - TZ=${TIME_ZONE}
      # 容器内监听端口，与下方端口映射保持一致
      - GOTIFY_SERVER_PORT=80
      - GOTIFY_DEFAULTUSER_NAME=${GOTIFY_DEFAULTUSER_NAME}
      - GOTIFY_DEFAULTUSER_PASS=${GOTIFY_DEFAULTUSER_PASS}
      - GOTIFY_REGISTRATION=${GOTIFY_REGISTRATION}
      - GOTIFY_PASSSTRENGTH=${GOTIFY_PASSSTRENGTH}
      # 数据库与上传目录保持镜像默认的相对路径，落在下方挂载的 /app/data 内
      - GOTIFY_DATABASE_DIALECT=sqlite3
      - GOTIFY_DATABASE_CONNECTION=data/gotify.db
      - GOTIFY_UPLOADEDIMAGESDIR=data/images
      - GOTIFY_PLUGINSDIR=data/plugins
    ports:
      - "${APP_PORT}:80"
    restart: always
    volumes:
      # SQLite 数据库、上传图片与插件，落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data:/app/data"
