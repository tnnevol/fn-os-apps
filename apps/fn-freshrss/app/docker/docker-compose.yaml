services:
  freshrss:
    container_name: fn-freshrss
    image: linuxserver/freshrss:1.30.1
    environment:
      # TRIM_UID/TRIM_GID 由 fnOS 注入，指向本应用的包用户；
      # 不可沿用上游硬编码的 1000（目标 NAS 上 1000 通常是登录用户，会导致数据目录写不进去）
      - PUID=${TRIM_UID}
      - PGID=${TRIM_GID}
      - TZ=${TIME_ZONE}
    ports:
      - "${APP_PORT}:80"
    restart: always
    volumes:
      # 订阅源、文章与配置，落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data:/config"
