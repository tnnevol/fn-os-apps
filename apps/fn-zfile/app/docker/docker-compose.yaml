services:
  zfile:
    container_name: fn-zfile
    image: zhaojun1998/zfile:5.1.0
    # 运行身份对齐包用户：镜像层默认 root，以 root 写数据会让卸载「删除所有数据」后残留；
    # 容器以包用户运行，运行期写入的文件属主才与卸载回调一致。
    user: "${TRIM_UID}:${TRIM_GID}"
    ports:
      - "${APP_PORT}:8080"
    restart: always
    volumes:
    # 数据落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）；容器内路径保持上游原样
      - "${TRIM_PKGVAR}/data/db:/root/.zfile-v4/db"
      - "${TRIM_PKGVAR}/data/logs:/root/.zfile-v4/logs"
      - "${TRIM_PKGVAR}/data/mnt:/data/file"
