services:
  maxkb:
    container_name: fn-maxkb
    image: 1panel/maxkb:v2.10.8-lts
    # 运行身份对齐包用户：镜像层默认 root，以 root 写数据会让卸载「删除所有数据」后残留；
    # 容器以包用户运行，运行期写入的文件属主才与卸载回调一致。
    user: "${TRIM_UID}:${TRIM_GID}"
    ports:
      - "${APP_PORT}:8080"
    restart: unless-stopped
    volumes:
      # 知识库与配置数据，落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data:/opt/maxkb"
