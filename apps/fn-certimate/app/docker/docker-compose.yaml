services:
  certimate:
    container_name: fn-certimate
    image: certimate/certimate:v0.4.36
    # 运行身份对齐包用户：镜像层默认 root，以 root 写数据会让卸载「删除所有数据」后残留；
    # 容器以包用户运行，运行期写入的文件属主才与卸载回调一致。
    user: "${TRIM_UID}:${TRIM_GID}"
    environment:
      - http_proxy=${HTTP_PROXY}
      - https_proxy=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
      - TZ=${TIME_ZONE}
    ports:
      - "${APP_PORT}:8090"
    restart: unless-stopped
    volumes:
      # 证书与配置数据，落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data:/app/pb_data"
