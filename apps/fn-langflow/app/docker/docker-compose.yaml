services:
  langflow:
    container_name: fn-langflow
    image: langflowai/langflow:1.12.5
    environment:
      # 上游由 1Panel 服务选择器注入 PANEL_DB_*，fnOS 改为向导显式填写
      - LANGFLOW_DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}
      # 必须用绝对路径：进程 cwd 是 /app，相对值会被拼成 /app/app，落盘时 PermissionError 起不来
      - LANGFLOW_CONFIG_DIR=/app/langflow
    ports:
      - "${APP_PORT}:7860"
    restart: always
    volumes:
    # 数据落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）；容器内路径保持上游原样
      - "${TRIM_PKGVAR}/data:/app/langflow"
