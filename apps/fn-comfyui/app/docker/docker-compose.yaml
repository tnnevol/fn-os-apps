services:
  comfyui:
    container_name: fn-comfyui
    image: 1panel/comfyui:v0.33.1
    # 运行身份对齐包用户：镜像层默认 root，以 root 写数据会让卸载「删除所有数据」后残留；
    # 容器以包用户运行，运行期写入的文件属主才与卸载回调一致。
    user: "${TRIM_UID}:${TRIM_GID}"
    environment:
      - COMFYUI_LISTEN=0.0.0.0
      - COMFYUI_PORT=8188
    ports:
      - "${APP_PORT}:8188"
    restart: always
    shm_size: "8gb"
    stop_grace_period: 2m
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      # 模型、工作流与生成结果，落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data:/data"
