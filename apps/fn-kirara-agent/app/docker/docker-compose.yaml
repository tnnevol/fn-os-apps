services:
  kirara-agent:
    container_name: fn-kirara-agent
    image: lss233/kirara-agent-framework:v3.2.0
    # 运行身份对齐包用户：镜像层默认 root，以 root 写数据会让卸载「删除所有数据」后残留；
    # 容器以包用户运行，运行期写入的文件属主才与卸载回调一致。
    user: "${TRIM_UID}:${TRIM_GID}"
    ports:
      - "${APP_PORT}:8080"
    restart: always
    volumes:
      # 智能体数据，落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）
      - "${TRIM_PKGVAR}/data:/app/data"
      # 应用启动时在工作目录下建 logs 目录（相对路径），镜像层不可写；
      # 不挂出来会 PermissionError: [Errno 13] Permission denied 并重启循环（真机复现）。
      - "${TRIM_PKGVAR}/logs:/app/logs"
