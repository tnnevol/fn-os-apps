services:
  domain-admin:
    container_name: fn-domain-admin
    image: mouday/domain-admin:v1.6.78
    ports:
      - "${APP_PORT}:8000"
    restart: always
    volumes:
    # 数据落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）；容器内路径保持上游原样
      - "${TRIM_PKGVAR}/data/database:/app/database"
      - "${TRIM_PKGVAR}/data/logs:/app/logs"
