services:
  astrbot:
    container_name: fn-astrbot
    image: soulter/astrbot:v4.29.3
    # 运行身份对齐包用户：镜像层默认 root，以 root 写数据会让卸载「删除所有数据」后残留；
    # 容器以包用户运行，运行期写入的文件属主才与卸载回调一致。
    user: "${TRIM_UID}:${TRIM_GID}"
    environment:
      - TZ=${TIME_ZONE}
    ports:
      - "${APP_PORT}:6185"
      - "${WEIXIN_OFFICIAL_PORT}:6194"
      - "${WECOM_PORT}:6195"
      - "${QQ_OFFICIAL_PORT}:6196"
      - "${QQ_PERSONAL_PORT}:6199"
      - "${WECHAT_PERSONAL_PORT}:11451"
    restart: always
    volumes:
    # 数据落在目标 NAS 的应用数据目录（TRIM_PKGVAR 由 fnOS 注入）；容器内路径保持上游原样
      - "${TRIM_PKGVAR}/data:/AstrBot/data"
